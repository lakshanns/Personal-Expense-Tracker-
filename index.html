<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>Personal Expense Tracker</h1>
    </header>

    <main class="container">
        <section class="dashboard">
            <h2>Financial Dashboard</h2>
            <p>Manage your income and expenses in one place.</p>
            <div class="summary-cards">
                <div class="card">
                    <h3>Total Income</h3>
                    <p id="total-income">LKR 0.00</p>
                </div>
                <div class="card">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">LKR 0.00</p>
                </div>
                <div class="card">
                    <h3>Current Balance</h3>
                    <p id="current-balance">LKR 0.00</p>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>Add a Transaction</h2>
            <form id="transaction-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" step="0.01" placeholder="Enter amount" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="add-btn">Add Transaction</button>
                    <button type="button" id="clear-btn">Clear Form</button>
                </div>
            </form>
        </section>

        <section class="history-section">
            <h2>Transaction History</h2>
            <div class="filter-row">
                <div class="form-group">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="search">Search Transactions</label>
                    <input type="text" id="search" placeholder="Search description or category">
                </div>
            </div>
            <div class="table-container">
                <table id="transaction-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <tr>
                            <td colspan="6" class="empty-message">No transactions found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
